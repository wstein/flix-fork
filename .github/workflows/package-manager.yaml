name: Package Manager

on: [ pull_request, merge_group ]

permissions:
  contents: read

# Cancel previous runs if the PR is updated
concurrency:
  cancel-in-progress: true
  group: test-flix-package-manager-${{ github.ref }}

jobs:
  build-and-test-pkg-man:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v5
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Mill and Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Build
        run: ./mill flix.compile
      - name: Test Package Manager suite with timeout
        env: # Only add tokens in this step to prevent other steps from abusing them
          GITHUB_CI_RUNNER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # secrets.GITHUB_TOKEN above is GitHub Actions' built-in, repo-scoped token -- it can't
          # see any other repository. GH_TOKEN is a real PAT with read access to the private
          # wstein/pr13165-package-renamed repo, so the private-install tests can actually run.
          # Withheld by GitHub on fork-originated pull_request runs, where those tests skip.
          GITHUB_PRIVATE_TEST_TOKEN: ${{ secrets.GH_TOKEN }}
        timeout-minutes: 15
        run: ./mill flix.testPackageManager
