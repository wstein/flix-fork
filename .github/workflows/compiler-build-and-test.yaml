name: Compiler

on:
  pull_request:
  merge_group:
  push:
    branches: [ develop ]

# Cancel previous runs if the PR is updated
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Mill and Coursier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Build
        run: ./mill flix.compile
      - name: Run tests with timeout
        # The suite ran ~21 minutes against a 20 minute wall and was killed with
        # CompilerSuite, the last suite, already running. This is headroom, not a
        # new budget: the wall exists so a hung test cannot burn a runner, and it
        # only does that job if it sits above the honest runtime rather than on it.
        timeout-minutes: 30
        # ScalaTest flags: -o = stdout reporter, C = suppress TestSucceeded, O = suppress SuiteCompleted
        run: ./mill flix.test.testForked "-oCO"

  build-and-test-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Mill and Coursier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Build
        run: ./mill flix.compile
      - name: Run example tests with timeout
        timeout-minutes: 20
        run: ./mill flix.testExamples
