name: VSCode

on: [pull_request, merge_group]

# Cancel previous runs if the PR is updated
concurrency:
  cancel-in-progress: true
  group: ide-tests-${{ github.ref }}

jobs:
  build-and-test-vscode:
    runs-on: ubuntu-latest

    steps:
      - name: Check out compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ./compiler
          fetch-depth: 0
          # Tags, so `git describe` can stamp the jar with the version it is; without them
          # it is `0.0.0+unknown`, which cannot answer what a `flix.toml` requires.
      - name: Check out flix/vscode-flix
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: "flix/vscode-flix"
          path: ./vscode-flix

      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.x'

      - name: Cache Mill and Coursier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('compiler/build.mill', 'compiler/.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Build compiler
        working-directory: ./compiler
        run: ./mill flix.assembly

      - name: Copy artifact
        run: cp ./compiler/out/flix/assembly.dest/out.jar ./vscode-flix/test/activeWorkspace/flix.jar

      - name: Install dependencies of VS Code extension
        working-directory: ./vscode-flix
        run: npm ci
      - name: Run VS Code extension tests
        working-directory: ./vscode-flix
        run: xvfb-run -a npm test
