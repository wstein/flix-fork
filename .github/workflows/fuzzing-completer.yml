name: Fuzz Autocomplete

on: [ pull_request, merge_group ]

# Cancel previous runs if the PR is updated
concurrency:
  cancel-in-progress: true
  group: ide-completion-tests-${{ github.ref }}

jobs:
  build-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Mill and Coursier
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Test with timeout
        timeout-minutes: 20
        run: ./mill flix.testIDECompletion
